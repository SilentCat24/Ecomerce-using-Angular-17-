 <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a routerLink="/" class="logo">🛍️ ShopNest</a>
          <h1>Create account</h1>
          <p>Join thousands of happy shoppers</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="auth-form">
          @if (error) {
            <div class="alert-error">{{ error }}</div>
          }
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" class="input" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" class="input" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="password" name="password" placeholder="Min 6 characters" class="input" required minlength="6">
          </div>
          <button type="submit" class="btn-submit" [disabled]="loading">
            {{ loading ? 'Creating account...' : 'Create Account' }}
          </button>
        </form>
        <p class="auth-footer">Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    </div>
