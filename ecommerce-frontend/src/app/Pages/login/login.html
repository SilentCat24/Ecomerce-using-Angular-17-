 <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <a routerLink="/" class="logo">🛍️ ShopNest</a>
          <h1>Welcome back</h1>
          <p>Sign in to continue shopping</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="auth-form">
          @if (error) {
            <div class="alert-error">{{ error }}</div>
          }
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com"
              class="input" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••"
              class="input" required>
          </div>
          <button type="submit" class="btn-submit" [disabled]="loading">
            {{ loading ? 'Signing in...' : 'Sign In' }}
          </button>
        </form>

        <p class="auth-footer">
          Don't have an account? <a routerLink="/register">Create one</a>
        </p>

        <div class="demo-creds">
          <strong>Demo:</strong> user@shop.com / user123 |
          admin@shop.com / admin123
        </div>
      </div>
    </div>
