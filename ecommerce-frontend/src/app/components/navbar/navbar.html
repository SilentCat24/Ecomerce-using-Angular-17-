 <nav class="navbar">
      <div class="nav-container">
        <a routerLink="/" class="nav-logo">
          <span class="logo-icon">🛍️</span>
          <span class="logo-text">ShopNest</span>
        </a>

        <div class="nav-links">
          <a routerLink="/products" routerLinkActive="active">Shop</a>
          @if (auth.isLoggedIn()) {
            <a routerLink="/orders" routerLinkActive="active">Orders</a>
          }
          @if (auth.isAdmin()) {
            <a routerLink="/admin" routerLinkActive="active" class="admin-link">Admin</a>
          }
        </div>

        <div class="nav-actions">
          <a routerLink="/cart" class="cart-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            @if (cart.itemCount() > 0) {
              <span class="cart-badge">{{ cart.itemCount() }}</span>
            }
          </a>

          @if (auth.isLoggedIn()) {
            <div class="user-menu">
              <button class="user-btn" (click)="toggleMenu()">
                <div class="avatar">{{ auth.currentUser()?.name?.charAt(0) }}</div>
              </button>
              @if (menuOpen) {
                <div class="dropdown">
                  <a routerLink="/profile" (click)="menuOpen = false">Profile</a>
                  <a routerLink="/orders" (click)="menuOpen = false">My Orders</a>
                  <hr>
                  <button (click)="logout()">Sign Out</button>
                </div>
              }
            </div>
          } @else {
            <a routerLink="/login" class="btn-login">Sign In</a>
          }
        </div>
      </div>
    </nav>
